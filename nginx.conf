server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router : toute URL inconnue → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check interne Docker
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Cache long terme pour les assets versionnés (hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Désactiver les logs pour les favicons
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
